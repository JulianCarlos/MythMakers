<div class="overview-main-container">
  <div class="project-overview-container no-select">
    <div class="project-overview-header">
      <h1>Projects</h1>
      <button
        class="btn btn--icon btn--primary"
        (click)="onAddProject()"
        aria-label="Add project"
      >
        <mat-icon fontIcon="add"></mat-icon>
      </button>
    </div>

    <div
      cdkDropList
      [cdkDropListData]="(projects$ | async) ?? []"
      class="project-overview-list-container"
    >
      @for (project of (projects$ | async) ?? []; track project.id) {
        <app-project-overview-list-item
          cdkDrag
          [project]="project"
          (rename)="onEditProject(project)"
          (delete)="onDeleteProject(project)"
          (open)="onProjectSelected(project)"
        >
        </app-project-overview-list-item>
      }
    </div>
  </div>

  <section class="details-pane">
    <div class="project-details-overview-container">
      <router-outlet></router-outlet>
    </div>
  </section>
</div>
