<div class="segment-header-container">
  <h2 class="segment-title">{{ title }}</h2>

  <button
    matButton
    [matMenuTriggerFor]="menu"
    class="btn btn--icon btn--ghost"
    aria-label="Add project"
  >
    <mat-icon fontIcon="open_in_full"></mat-icon>
  </button>
  <mat-menu #menu="matMenu">
    <button mat-menu-item (click)="onChangeSize('small')">Small</button>
    <button mat-menu-item (click)="onChangeSize('medium')">Medium</button>
    <button mat-menu-item (click)="onChangeSize('large')">Large</button>
  </mat-menu>
</div>

<div class="entity-list__grid" role="list">
  @for (item of items; track idOf(item)) {
    <div class="entity-list__tile" role="listitem">
      <ng-container
        *ngIf="itemTpl; else defaultTile"
        [ngTemplateOutlet]="itemTpl"
        [ngTemplateOutletContext]="{ $implicit: item }"
      >
      </ng-container>

      <ng-template #defaultTile>
        <button
          type="button"
          [ngClass]="itemButtonClass"
          class="entity-list__button"
          [style.background]="tileBackground || null"
          (click)="onSelect(item)"
        >
          {{ labelOf(item) }}
        </button>

        <button
          [matMenuTriggerFor]="itemMenu"
          type="button"
          class="btn btn--icon btn--outline delete"
          [attr.aria-label]="removeAriaLabel"
        >
          <mat-icon fontIcon="more_vert" aria-hidden="true"></mat-icon>
        </button>

          <mat-menu #itemMenu="matMenu" xPosition="after" yPosition="below">
            <button mat-menu-item (click)="$event.stopPropagation();">
              <mat-icon fontIcon="edit"></mat-icon>
              <span>Edit</span>
            </button>
            <button mat-menu-item (click)="$event.stopPropagation(); onRemove(item)">
              <mat-icon fontIcon="delete"></mat-icon>
              <span>Delete</span>
            </button>
          </mat-menu>
      </ng-template>
    </div>
  }

  @if (canAdd) {
    <button
      type="button"
      [attr.aria-label]="addAriaLabel"
      [ngClass]="addButtonClass"
      class="entity-list__button add-button"
      [style.background]="tileBackground || null"
      (click)="onAdd()"
    >
      +
    </button>
  }
</div>
