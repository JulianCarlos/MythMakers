<form [formGroup]="form">
  <div class="project-details-overview-container">
    @if (project$ | async; as project) {
      <div class="project-details-header">
        <h1>{{ project.name }}</h1>
        <input
          type="search"
          id="siteSearch"
          name="q"
          formControlName="siteSearch"
        />
      </div>
      <br />

      <app-worlds-view
        [project]="project"
        [searchInput]="searchInput"
        (removeWorldId)="removeWorld(project, $event)"
        (openWorld)="openWorld($event)"
        (addWorldName)="addWorld(project, $event)"
      >
      </app-worlds-view>

      <app-countries-view
        [project]="project"
        [searchInput]="searchInput"
        (removeCountryId)="removeCountry(project, $event)"
        (openCountry)="openCountry($event)"
        (addCountryName)="addCountry(project, $event)"
      >
      </app-countries-view>

      <app-cities-view
        [project]="project"
        [searchInput]="searchInput"
        (removeCityId)="removeCity(project, $event)"
        (openCity)="openCity($event)"
        (addCityName)="addCity(project, $event)"
      >
      </app-cities-view>

      <app-characters-view
        [project]="project"
        [searchInput]="searchInput"
        (removeCharacterId)="removeCharacter(project, $event)"
        (openCharacter)="openCharacter($event)"
        (addCharacterName)="addCharacter(project, $event)"
      >
      </app-characters-view>
    }
  </div>
</form>
