<form [formGroup]="form">
  <div class="project-details-overview-container">
    @if (project$ | async; as project) {
      <div class="project-details-header vertical-flex">
        <h1>{{ project.name }}</h1>
        <input
          type="search"
          id="siteSearch"
          name="q"
          formControlName="siteSearch"
        />
      </div>
      <br />

      <app-worlds-view
        [project]="project"
        [searchInput]="searchQuery"
        (removeWorldId)="remove(project, 'worlds', $event)"
        (openWorld)="open('world', $event)"
        (addWorldName)="add(project, 'worlds', $event)"
      >
      </app-worlds-view>

      <app-countries-view
        [project]="project"
        [searchInput]="searchQuery"
        (removeCountryId)="remove(project, 'countries', $event)"
        (openCountry)="open('country', $event)"
        (addCountryName)="add(project, 'countries', $event)"
      >
      </app-countries-view>

      <app-cities-view
        [project]="project"
        [searchInput]="searchQuery"
        (removeCityId)="remove(project, 'cities', $event)"
        (openCity)="open('city', $event)"
        (addCityName)="add(project, 'cities', $event)"
      >
      </app-cities-view>

      <app-characters-view
        [project]="project"
        [searchInput]="searchQuery"
        (removeCharacterId)="remove(project, 'characters', $event)"
        (openCharacter)="open('character', $event)"
        (addCharacterName)="add(project, 'characters', $event)"
      >
      </app-characters-view>
    }
  </div>
</form>
