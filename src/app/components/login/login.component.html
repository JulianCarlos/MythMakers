<form [formGroup]="form" class="login-form" (ngSubmit)="login()">
  <div class="login-container">
    <h2>Welcome Back</h2>
    <p>Please log in to continue</p>

    <input
      type="text"
      placeholder="Username"
      formControlName="username"
      autocomplete="username"
    />
    <div *ngIf="form.controls['username'].touched && form.controls['username'].invalid" class="error">
      Username is required
    </div>

    <input
      type="password"
      placeholder="Password"
      formControlName="password"
      autocomplete="current-password"
    />
    <div *ngIf="form.controls['password'].touched && form.controls['password'].invalid" class="error">
      Password is required
    </div>

    <div *ngIf="loginError" class="error" aria-live="polite">
      {{ loginError }}
    </div>

    <button class="btn btn--primary btn--sm" type="submit" [disabled]="form.invalid">Login</button>
  </div>
</form>
