<h2 class="segment-title">Worlds</h2>

<div class="world-display-container">
  @for (world of worlds; track world.id) {
    <button class="btn btn--icon btn--primary world-display"
            (click)="onClickWorld(world)">
      {{ world.name }}
    </button>
  }

  <button class="btn btn--icon btn--outline world-display" (click)="onAddWorldItem()">
    <mat-icon fontIcon="add"></mat-icon>
  </button>
</div>
